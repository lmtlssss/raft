name: Exclusive snapshot reservation tests (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: fix-unique-snapshot-reservation-20261025
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source formatting
        run: test -z "$(gofmt -l file_snapshot.go file_snapshot_unique_test.go)"
      - name: Run exact collision and existing snapshot tests
        run: go test -count=1 -run 'TestFileSS_|TestFileSnapshot' .
      - name: Race-detector on exclusive snapshot claims
        run: go test -race -count=1 -run 'TestFileSS_CreateDoesNotTruncateActiveCollision|TestFileSS_CreateDoesNotReuseFinalizedID' .
