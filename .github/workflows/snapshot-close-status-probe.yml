name: Snapshot close success invariant (no secrets)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-snapshot-close-status-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: gofmt -w file_snapshot_close_status_test.go
      - run: go test -count=1 -run TestFileSnapshotSinkFailedCloseIsNotLaterReportedSuccessful -v .
