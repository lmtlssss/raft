name: Snapshot duplicate ID baseline regression (expected failure)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/snapshot-collision-unmodified-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Demonstrate collision on unchanged file_snapshot.go
        run: go test -count=1 -run 'TestFileSS_CreateDoesNotTruncateActiveCollision|TestFileSS_CreateDoesNotReuseFinalizedID' .
